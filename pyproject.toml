[project]
name = "vox"
version = "0.1.0"
description = "The project is the implementation of a demo of an IT call center agent."
readme = "README.md"
authors = [
    { name = "Anna Merlou", email = "anna.merlou@satorianalytics.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.140.7",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]


[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/vox"] # check the coverage only in the code
branch = true 

[tool.coverage.report]
show_missing = true # show the missing lines
fail_under = 85 # the % under which teh tests are failing
